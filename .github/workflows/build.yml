name: Build See your Trajectory!

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Clone upstream source
        run: |
          git clone https://github.com/maDU59/ProjectilesTrajectoryPreview.git upstream
          cd upstream
          git checkout 5e76cb8c1a8a70368209fc944bcb4f28f4acf5d0

      - name: Apply See your Trajectory patch
        run: python3 tools/apply_rebrand.py upstream

      - name: Build
        run: |
          cd upstream
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Collect jar
        run: |
          mkdir -p dist
          JAR=$(find upstream/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' | head -n 1)
          cp "$JAR" dist/see-your-trajectory.jar

      - name: Upload ready jar
        uses: actions/upload-artifact@v4
        with:
          name: see-your-trajectory-26.2
          path: dist/see-your-trajectory.jar
